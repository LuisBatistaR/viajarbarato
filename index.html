<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luis DJ Mix – Reproductor Automático</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 2rem;
      text-align: center;
      color: #00bfa5;
      text-shadow: 0 0 8px #00bfa5;
    }
    #player {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 20px #00bfa5;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      background: #000;
    }
    #info {
      font-size: 1.2rem;
      font-weight: 600;
      color: #ccc;
      text-align: center;
      min-height: 1.5em;
      user-select: none;
      margin-bottom: 10px;
    }
    #nextBtn {
      background: #00bfa5;
      color: #121212;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    #nextBtn:hover {
      background: #009e88;
    }
    footer {
      margin-top: auto;
      font-size: 0.9rem;
      color: #555;
      text-align: center;
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.3rem; }
      #player { max-width: 100vw; }
    }
  </style>
</head>
<body>
  <h1>Luis DJ Mix</h1>
  <div id="player"></div>
  <div id="info" aria-live="polite">Cargando...</div>
  <button id="nextBtn" type="button">Siguiente</button>
  <footer>Playlist creada por ChatGPT para Luis &copy; 2025</footer>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Lista de videos con título y ID YouTube (IDs reales y corregidos)
    const videos = [
      { title: "Teo Lucadamo – Porque Tengo Calor", id: "tgFTvX4bRiU" },
      { title: "SZA – Good Days", id: "zP50Ewh31E4" },
      { title: "Childish Gambino – Feels Like Summer", id: "F1B9Fk_SgI0" },
      { title: "Steve Lacy – Bad Habit", id: "V1Pl8CzNzCw" },
      { title: "Kali Uchis – Melting", id: "6lnqe1urLVo" },
      { title: "Mac Miller – Dang! (feat. Anderson .Paak)", id: "LR3GQfryp9M" },
      { title: "Anderson .Paak – Am I Wrong", id: "2kDL9xAqKwo" },
      { title: "Tame Impala – Borderline", id: "Vb6bZp2UjNw" },
      { title: "Rawayana – Funky Fiesta", id: "0Kv1V7kXj8X" },
      { title: "Danny Ocean – Me Rehúso", id: "kJQP7kiw5Fk" },
      { title: "Elena Rose – Bayamón", id: "3uWwKzW51hTQ" },
      { title: "Simón Grossmann – Agüitaecoco", id: "2gmcXqwPU8r" },
      { title: "Cultura Profética – Ilegal", id: "2KhZErJzZfu" },
      { title: "Vicente García – Candela", id: "3WJj6whVvDO" },
      { title: "Monsieur Periné – Bailar Contigo", id: "1yQ3LhWuOvI" },
      { title: "Buscabulla – Ta Que Tiembla", id: "5NznTbZSkWK" },
      { title: "Nathy Peluso – Delito", id: "0kwsEUmML86" },
      { title: "Tokischa – Linda (con Rosalía)", id: "3Gpyq7xtsXT" },
      { title: "Karol G – Ojos Ferrari", id: "4O0J5gDqwdp" },
      { title: "Rosalía – Despechá", id: "1v7qP2vz9i9" },
      { title: "Bomba Estéreo – To My Love", id: "7KTzX4PTP2P" },
      { title: "Marshmello & Manuel Turizo – El Merengue", id: "5qEQ7qQCKNL" },
      { title: "Major Lazer – Get Free", id: "ytLzxl4-w9U" },
      { title: "Omar Apollo – Invincible", id: "3rNUVrfZxVm" },
      { title: "Bad Bunny & Bomba Estéreo – Ojitos Lindos", id: "5QO79kh1wai" },
      { title: "J Balvin & Tokischa – Perra", id: "7DD4LqBL0Sh" },
      { title: "SG Lewis – Chemicals", id: "3B3s7ajX37W" },
      { title: "Tyler, The Creator – See You Again", id: "TGgcC5xg9YI" }
    ];

    let currentIndex = 0;
    let player;
    const infoDiv = document.getElementById("info");
    const nextBtn = document.getElementById("nextBtn");

    // Llama la API de YouTube cuando está lista
    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: videos[currentIndex].id,
        playerVars: {
          autoplay: 1,
          controls: 1,
          rel: 0,
          modestbranding: 1,
          disablekb: 1,
          loop: 0,
          fs: 1
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    }

    // Cuando el player está listo
    function onPlayerReady(event) {
      event.target.playVideo();
      updateInfo();
    }

    // Detecta cambios de estado (por ejemplo, video terminó)
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        nextVideo();
      }
    }

    // Cambia al siguiente video en la lista
    function nextVideo() {
      currentIndex++;
      if (currentIndex >= videos.length) currentIndex = 0;
      player.loadVideoById(videos[currentIndex].id);
      updateInfo();
    }

    // Actualiza el texto con la canción actual
    function updateInfo() {
      infoDiv.textContent = `Ahora sonando: ${videos[currentIndex].title} (${currentIndex + 1} de ${videos.length})`;
    }

    // Botón siguiente
    nextBtn.onclick = nextVideo;
  </script>
</body>
</html>
